<app-header />
<main>
  <div id="dashboard">
    <app-dashboard-item
      [imageSignal]="{ src: 'status.png', alt: 'Signal symbol' }"
      [titleSignal]="'Server Status'"
    >
      <app-server-status />
    </app-dashboard-item>

    <app-dashboard-item
      [imageSignal]="{ src: 'globe.png', alt: 'A globe' }"
      [titleSignal]="'Traffic'"
    >
      <app-traffic />
    </app-dashboard-item>

    <app-dashboard-item
      [imageSignal]="{ src: 'list.png', alt: 'A list of items' }"
      [titleSignal]="'Support Tickets '"
    >
      <app-tickets />
    </app-dashboard-item>
  </div>
</main>
